name: Deploy Frontend to Production (Zero Downtime)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server (Zero Downtime)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/ubuntu/menu-plus/menu-plus-front
            
            echo "📥 Pulling latest code..."
            git fetch --all
            git checkout main
            git pull origin main
            
            echo "🔨 Building new image (app still running)..."
            # Build new image with a temporary tag while old container runs
            sudo docker build --no-cache -t menu-plus-front:new .
            
            echo "🔄 Swapping containers (minimal downtime)..."
            # Stop and remove old container
            sudo docker stop menusesqr-front || true
            sudo docker rm menusesqr-front || true
            
            # Tag new image as latest
            sudo docker tag menu-plus-front:new menu-plus-front:latest
            sudo docker rmi menu-plus-front:new || true
            
            echo "🚀 Starting new container..."
            cd /home/ubuntu
            sudo docker compose up -d --no-deps front
            
            # Cleanup old images
            sudo docker image prune -f
            
            echo "✅ Frontend deployed successfully with minimal downtime!"
            sudo docker logs menusesqr-front --tail 20
