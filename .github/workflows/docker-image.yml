name: Deploy Frontend to Production (Zero Downtime)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./*,!.git,!.env.local"
          target: "/home/ubuntu/menu-plus/menu-plus-front"
          overwrite: true
          strip_components: 0

      - name: Build and Deploy (Zero Downtime)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/ubuntu/menu-plus/menu-plus-front
            
            echo "🔨 Building new image (app still running)..."
            sudo docker build --no-cache -t menu-plus-front:new .
            
            echo "🔄 Swapping containers (minimal downtime)..."
            sudo docker stop menusesqr-front || true
            sudo docker rm menusesqr-front || true
            
            sudo docker tag menu-plus-front:new menu-plus-front:latest
            sudo docker rmi menu-plus-front:new || true
            
            echo "🚀 Starting new container..."
            cd /home/ubuntu
            sudo docker compose up -d --no-deps front
            
            sudo docker image prune -f
            
            echo "✅ Frontend deployed successfully!"
            sudo docker logs menusesqr-front --tail 20

      - name: Run Playwright E2E Tests
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set +e
            echo "⏳ Waiting for frontend to be ready..."
            sleep 10

            cd /home/ubuntu/menu-plus/menu-plus-front
            ./run-tests.sh || true

            echo "⚠️ Tests completed (failures do not block deploy)"
